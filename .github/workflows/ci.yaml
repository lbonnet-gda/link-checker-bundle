name: CI

on:
    push:
        branches: [ main, master ]
    pull_request:
        branches: [ main, master ]

permissions:
    contents: read

jobs:
    phpunit:
        name: PHP ${{ matrix.php }} + Symfony ${{ matrix.symfony }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                include:
                    - { php: '8.1', symfony: '6.4.*' } # absolute floor
                    - { php: '8.4', symfony: '6.4.*' } # 6.4 LTS on latest PHP
                    - { php: '8.2', symfony: '7.0.*' } # floor of branch 7
                    - { php: '8.4', symfony: '7.4.*' } # 7.4 LTS
                    - { php: '8.4', symfony: '8.0.*' } # floor of branch 8
                    - { php: '8.4', symfony: '8.1.*' } # current stable

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: mbstring, xml, ctype, iconv
                    coverage: none

            -   name: Configure Symfony requirement
                run: |
                    composer global config --no-plugins allow-plugins.symfony/flex true
                    composer global require --no-progress --no-scripts --no-plugins symfony/flex
                    composer config extra.symfony.require "${{ matrix.symfony }}"

            -   name: Install dependencies
                uses: ramsey/composer-install@v4
                with:
                    dependency-versions: highest

            -   name: Run PHPUnit tests
                run: ./vendor/bin/phpunit

    phpunit-lowest:
        name: PHP 8.1 + Symfony 6.4 (lowest deps)
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.1'
                    extensions: mbstring, xml, ctype, iconv
                    coverage: none

            -   name: Configure Symfony requirement
                run: |
                    composer global config --no-plugins allow-plugins.symfony/flex true
                    composer global require --no-progress --no-scripts --no-plugins symfony/flex
                    composer config extra.symfony.require "6.4.*"

            -   name: Install dependencies
                uses: ramsey/composer-install@v4
                with:
                    dependency-versions: lowest

            -   name: Run PHPUnit tests
                run: ./vendor/bin/phpunit

    phpstan:
        name: PHPStan (${{ matrix.dependency-versions }} deps)
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                dependency-versions: [ highest, lowest ]

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    extensions: mbstring, xml, ctype, iconv
                    coverage: none

            -   name: Install dependencies
                uses: ramsey/composer-install@v4
                with:
                    dependency-versions: ${{ matrix.dependency-versions }}

            -   name: Run PHPStan
                run: ./vendor/bin/phpstan analyse --no-progress

    ci-status:
        name: CI Status
        needs: [ phpunit, phpunit-lowest, phpstan ]
        runs-on: ubuntu-latest
        if: always()
        steps:
            -   run: |
                    if [ "${{ needs.phpunit.result }}" != "success" ] || [ "${{ needs.phpunit-lowest.result }}" != "success" ] || [ "${{ needs.phpstan.result }}" != "success" ]; then
                      exit 1
                    fi
